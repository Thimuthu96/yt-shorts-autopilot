# ─── Channel ────────────────────────────────────────────────────────────────
channel:
  niche: >-
    Daily crypto, forex and gold market brief: one lead story per brief (Bitcoin,
    Ethereum, gold or a major currency pair), the news behind it, how it spreads to
    related markets, and the high-impact events traders are watching today. Plus a
    daily gold (XAU/USD) outlook with key levels, liquidity and timeframe bias.
  audience: Retail crypto and forex traders and curious beginners
  tone: Clear, fast, neutral and factual, like a market news anchor; no hype
  language: en
  display_name: CryptoFX Daily        # shown at the top of every graphic

# ─── Content generation (Google Gemini, free tier) ──────────────────────────
llm:
  model: gemini-3.8-flash     # free tier; see https://ai.google.dev/gemini-api/docs/models
  # Tried in order if the main model is retired or unavailable (404).
  fallback_models: [gemini-3.7-flash, gemini-3.5-flash, gemini-flash-latest, gemini-3.5-flash-lite]
  min_words: 115              # narration length → roughly 45–55 seconds
  max_words: 145

# ─── Market data (all free, no keys) ────────────────────────────────────────
market:
  news_hours: 30              # how far back to read headlines
  calendar_hours_ahead: 24    # economic events shown: from now until this many hours ahead
  calendar_impacts: [High]    # add Medium for more events

# ─── Editions: up to 3 briefs a day, one per trading-session open ──────────
# start_utc = when the edition is due. The runs are started by the outside timer (cron-job.org)
# and the backup cron lines in .github/workflows/autopilot.yml; keep all three in step.
# platforms: where an edition is published. Video editions default to [youtube, facebook]
# (one render: a YouTube Short + a Facebook Reel); kind: post editions are Facebook-only.
sessions:
  asia:
    label: Asia Open
    short: Asia
    start_utc: "00:30"
    focus: >-
      Cover what moved since the New York close, crypto overnight, the yen and the
      Australian dollar, and events coming up in the Asian and European sessions.
  london:
    label: London Open
    short: London
    start_utc: "05:40"
    focus: >-
      Cover what happened in the Asian session, the euro and the pound, and the day's
      biggest scheduled events.
  newyork:
    label: New York Open
    short: New York
    start_utc: "12:30"
    focus: >-
      Cover moves since the London open, the US dollar, Bitcoin and Ethereum, and what is
      still ahead on today's calendar.
  # Daily gold outlook (not a market brief): bias for the next 1h / 4h / day, liquidity, levels.
  # 06:15 UTC = after the Asian session has set its range (00:00-06:00 GMT), before London opens
  # (07:00 GMT summer / 08:00 GMT winter), when gold is most liquid and Asian highs/lows get tested,
  # and well before US data (12:30-14:00 GMT). Weekdays only (not in weekend_sessions).
  gold:
    label: Gold Outlook
    short: Gold
    start_utc: "06:15"
    kind: gold
  # Facebook news image posts (3 a day, weekends too): one market-moving story each, a big
  # headline card + an SEO caption. 03:00 / 09:30 / 16:30 UTC = 08:30 / 15:00 / 22:00 Sri Lanka.
  news_morning:
    label: Morning News
    short: News
    start_utc: "03:00"
    kind: post
    platforms: [facebook]
  news_midday:
    label: Midday News
    short: News
    start_utc: "09:30"
    kind: post
    platforms: [facebook]
  news_evening:
    label: Evening News
    short: News
    start_utc: "16:30"
    kind: post
    platforms: [facebook]
  # Trading lesson (kind: lesson): the next curriculum episode as a 16:9 YouTube video (Education)
  # and a 9:16 Facebook Page video, Tue/Thu/Sat/Sun only (`days`: timed runs skip other days; a
  # manual run works any day). 14:30 UTC = 20:00 Sri Lanka. Off until `lessons.enabled: true`.
  lesson:
    label: Trading Lesson
    short: Lesson
    start_utc: "14:30"
    kind: lesson
    days: [tue, thu, sat, sun]
    platforms: [youtube, facebook]
# Forex is closed at weekends, so only these editions run on Saturday and Sunday
# (automatic runs only; a manual run can still choose any edition). News posts run every day;
# the lesson runs on its own `days` (Saturday and Sunday included).
weekend_sessions: [london, news_morning, news_midday, news_evening, lesson]
# Timed runs (GitHub schedule or the outside timer) that start more than this many minutes
# after the edition's start_utc are skipped, so a very late run can't post the wrong edition.
max_late_minutes: 180

# ─── Facebook Page (Graph API; secrets FB_PAGE_ID + FB_PAGE_TOKEN, see README) ─
# Skipped with a log line when the secrets are missing or enabled is false.
facebook:
  enabled: true
  graph_version: v26.0
  poll_minutes: 10            # how long to wait for a Reel to finish publishing
  max_hashtags: 5             # Meta favours a few specific hashtags

# ─── Facebook news image posts (kind: post editions) ────────────────────────
news_posts:
  news_hours: 48              # stories considered
  fresh_hours: 12             # preferred: stories from the last 12 h not used by an earlier post
  # how much each kind of story matters (plus multi-outlet coverage and recency)
  topic_weights: {rates: 1.0, central_bank: 0.85, geopolitics: 0.9, tariffs: 0.9, regulation: 0.8,
                  macro: 0.8, crypto: 0.5, gold: 0.5, fx: 0.5}
  disclaimer: >-
    News for information only, not financial advice. Crypto and forex trading carry a high
    risk of loss.

# ─── News post backgrounds ──────────────────────────────────────────────────
# cloudflare = Workers AI FLUX.1 schnell, free tier (secrets CF_ACCOUNT_ID + CF_API_TOKEN).
# Without them (or on an error): a random image from assets/backgrounds/<topic>/, else a
# drawn branded background. provider: none = never use AI.
images:
  provider: cloudflare
  model: "@cf/black-forest-labs/flux-1-schnell"
  steps: 6                    # 4-8; ~60 of the free 10k daily neurons per image

# ─── Trading lessons (the `lesson` edition) ─────────────────────────────────
# Curriculum: lessons/curriculum.yaml (list order = queue), glossary: lessons/glossary.yaml.
# Keep enabled: false until YT_REFRESH_TOKEN has the lesson scopes (python get_token.py) and the
# owner's curriculum is merged; while false, lesson runs log why and stop (nothing fetched or posted).
lessons:
  enabled: false
  max_seconds: 300            # narration limit; re-recorded faster when over
  review_window_hours: 24     # YouTube: private, then public on its own this many hours later
  path_playlist: "Trading Lessons · The Path"   # every lesson, curriculum order
  track_playlist: "Track {n} · {name}"          # {n} = track number, {name} = track name
  fb_published: true          # false = Facebook videos are uploaded unpublished

# ─── Gold outlook ───────────────────────────────────────────────────────────
gold:
  footer: "Not financial advice · Rule-based outlook · Data: PAXG/Kraken, Swissquote, US Treasury"

# ─── Voice (Microsoft Edge neural voices via edge-tts, free) ────────────────
voice:
  name: en-US-AndrewMultilingualNeural   # list voices: edge-tts --list-voices
  rate: "+10%"

# ─── Video ──────────────────────────────────────────────────────────────────
video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 59             # keep under a minute for the classic Shorts shelf
  accent: "FFD400"            # brand colour on the graphics
  footer: "Not financial advice · Data: Coinbase, ECB/Frankfurter, ForexFactory"
  captions:
    font: DejaVu Sans
    size: 84
    words_per_line: 3
    color: "FFFFFF"           # RRGGBB
    highlight: "FFD400"       # colour of the word being spoken
    outline: 7
    uppercase: true
  # Drop royalty-free .mp3 files into the music/ folder to add quiet background
  # music. Leave the folder empty for voice only.
  music_volume: 0.08

# ─── Upload ─────────────────────────────────────────────────────────────────
upload:
  enabled: true
  category_id: "25"           # 25 = News & Politics, 27 = Education
  privacy_status: public      # public | unlisted | private
  # Hours between upload and going public. During that window the video sits
  # private and you can watch it in YouTube Studio and delete it if it's wrong.
  # 0 = publish straight away (fully hands-off).
  review_window_hours: 0
  notify_subscribers: true
  contains_synthetic_media: false
  # Also try to upload thumbnail.jpg as the custom thumbnail (YouTube only accepts this for
  # some channels, e.g. Partner Program members). Refusals are ignored.
  set_thumbnail: true
  disclaimer: >-
    This video is for information and education only and is not financial advice.
    Crypto and forex trading carry a high risk of loss. Do your own research.
