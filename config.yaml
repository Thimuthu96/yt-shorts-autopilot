# ─── Gus Explains: two odd-fact cartoon Shorts a day (YouTube Short + Facebook Reel) ───────────────────────
# Spec: docs/superpowers/specs/2026-11-12-gus-explains-design.md. Read by main.py.

channel:
  name: Gus Explains
  language: en

# The edition gate. While false, timed runs (--scheduled) log why and exit 0; manual runs still make and publish.
# The owner turns it on after the rebrand (spec §8a).
gus:
  enabled: true
  cutover: "2026-11-13"       # the day the crypto channel stopped: scripts/delete_old_content.py's default --before
  min_backlog: 10             # fewer queued topics in topics/backlog.yaml → Gemini proposes refill_count more after a publish
  refill_count: 15
  max_topics: 3               # topics tried per run (a writer / too-long failure marks the topic failed, next one)

# ─── Gemini (free tier; never enable billing on the AI Studio project) ──────────────────────────────────────
llm:
  model: gemini-3.8-flash     # see https://ai.google.dev/gemini-api/docs/models
  # Tried in order if the main model is retired or unavailable (404) or out of daily quota.
  fallback_models: [gemini-3.7-flash, gemini-3.5-flash, gemini-flash-latest, gemini-3.5-flash-lite]

# ─── Editions (UTC). The run starts ~35 min before the publish time: research + render take ~20-30 min (est.) ─────
# start_utc = when the run is due (the outside timer, cron-job.org, fires then; the workflow's backup cron 17 min
# later). Keep start_utc, the cron-job.org job and the workflow cron line in step (Task 17).
sessions:
  short_a:
    label: Short A
    start_utc: "16:25"
    publish_note: "~17:00 UTC"
    platforms: [youtube, facebook]
  short_b:
    label: Short B
    start_utc: "22:25"
    publish_note: "~23:00 UTC"
    platforms: [youtube, facebook]

# Timed runs that start later than this after start_utc (or more than 30 min early) skip (the next slot is close).
max_late_minutes: 120

# ─── Voice (edge-tts; Piper when Microsoft refuses the runner) ──────────────────────────────────────────────
voice:
  name: en-US-AndrewMultilingualNeural   # the owner-approved sample voice (Task 8E)
  rate: "+8%"                 # fast delivery; over video.max_seconds → re-recorded once faster, still over → next topic
  fallback: en_US-ryan-high   # free local Piper voice (downloaded on first use)

# ─── Video ──────────────────────────────────────────────────────────────────────────────────────────────────
video:
  max_seconds: 60             # Shorts limit we keep under (45-60 s target)
  music_db: -20               # music level under the voice (ducked); tracks in music/tracks.yaml
  render_scale: 1.0           # studio render scale (1.0 = 1080x1920); lower only for local previews
  render_timeout_minutes: 45  # a render still running after this is killed (RenderError, the run fails)

# ─── Facebook Page (Graph API; secrets FB_PAGE_ID + FB_PAGE_TOKEN, see README) ─────────────────────────────
# Skipped with a log line when the secrets are missing or enabled is false.
facebook:
  enabled: false              # paused by the owner (2026-11-14) until the Page is ready; YouTube only
  graph_version: v26.0
  poll_minutes: 10            # how long to wait for a Reel to finish publishing
  max_hashtags: 5

# ─── YouTube upload ─────────────────────────────────────────────────────────────────────────────────────────
upload:
  enabled: true
  category_id: "22"           # People & Blogs (owner choice; 27 = Education)
  privacy_status: public
  review_window_hours: 0      # 0 = public at once (hands-off); > 0 = private, goes public that many hours later
  notify_subscribers: true
  # YouTube's altered or synthetic content label is required for realistic content a viewer could mistake for a
  # real person, place or event. It is not required for clearly unrealistic content such as animation, nor for a
  # generic synthetic narrator that doesn't imitate a real person. Gus Explains is a code-animated cartoon with a
  # stock TTS voice, so false; the description still says "Narrated with a synthetic voice." (owner's rule).
  contains_synthetic_media: false
  set_thumbnail: true         # frame 0; YouTube refuses custom Shorts thumbnails for most channels (ignored)
  disclaimer: "Narrated with a synthetic voice."
