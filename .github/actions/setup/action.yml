name: Set up Gus Explains
description: Node 22 + npm ci + Playwright Chromium (with system deps), Python 3.12 + pip packages, ffmpeg. Caches npm, pip and the Playwright browsers.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - name: Install Node packages
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Playwright version
      id: pw
      shell: bash
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

    - name: Install Chromium (and its system libraries)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Install Chromium's system libraries (browser restored from cache)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Python packages
      shell: bash
      run: pip install -r requirements.txt

    - name: Install ffmpeg
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
