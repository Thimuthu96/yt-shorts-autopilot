name: Shorts autopilot

on:
  schedule:
    # Times are UTC. Sri Lanka time = UTC + 5:30. GitHub may start runs a few minutes late.
    - cron: "30 0 * * *"    # Asia Open      → 06:00 Sri Lanka
    - cron: "40 5 * * *"    # London Open    → 11:10 Sri Lanka
    - cron: "30 12 * * *"   # New York Open  → 18:00 Sri Lanka
  workflow_dispatch:          # the "Run workflow" button
    inputs:
      session:
        description: "Edition to make"
        type: choice
        options: [auto, asia, london, newyork]
        default: auto
      force:
        description: "Make it even if this edition is already uploaded today"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save data/history.json back to the repo

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload Short
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # which edition: from the schedule that fired, or from the manual run's choice
          SESSION: "${{ github.event_name == 'schedule' && (github.event.schedule == '30 0 * * *' && 'asia' || github.event.schedule == '40 5 * * *' && 'london' || 'newyork') || inputs.session || 'auto' }}"
          SCHEDULED: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python main.py --session "$SESSION" $SCHEDULED $FORCE

      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Log uploaded Short"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Keep the video and logs for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/short.mp4
            output/*/package.json
            output/*/metadata.json
            output/*/data.json
            output/*/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
