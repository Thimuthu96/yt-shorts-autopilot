name: Shorts autopilot
run-name: "${{ github.event_name == 'schedule' && 'Backup schedule' || (github.event.inputs.scheduled == 'true' && 'Timer' || 'Manual') }} · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.session }}${{ inputs.slot && format(' · slot {0}', inputs.slot) || '' }}${{ inputs.trigger && format(' · trigger {0}', inputs.trigger) || '' }}"

on:
  # The main trigger is an outside timer (cron-job.org) calling workflow_dispatch on time with
  # scheduled=true; see CLAUDE.md. GitHub's own schedule is unreliable (runs hours late or
  # never), so these crons are only a backup, 17 min after each edition's start time.
  # Times are UTC. Sri Lanka time = UTC + 5:30.
  # If you change a cron line, change the same string in EDITION below and in concurrency.group.
  schedule:
    - cron: "17 12 * * *"   # Morning News   (Facebook post, due 12:00 UTC → 17:30 Sri Lanka)
    - cron: "17 13 * * *"   # Short A        (due 13:00 UTC → 18:30 Sri Lanka)
    - cron: "17 15 * * 3"   # Crypto Basics  (due 15:00 UTC → 20:30 Sri Lanka), Wednesday
    - cron: "17 15 * * 4"   # Trading Lesson (due 15:00 UTC → 20:30 Sri Lanka), Thursday
    - cron: "17 15 * * 6"   # Weekly Recap   (due 15:00 UTC → 20:30 Sri Lanka), Saturday; else the top-up
    - cron: "17 15 * * 0"   # Sunday top-up  (due 15:00 UTC → 20:30 Sri Lanka), only when the week is short
    - cron: "17 16 * * *"   # Midday News    (Facebook post, due 16:00 UTC → 21:30 Sri Lanka)
    - cron: "17 21 * * *"   # Evening News   (Facebook post, due 21:00 UTC → 02:30 Sri Lanka)
    - cron: "17 23 * * *"   # Short B        (due 23:00 UTC → 04:30 Sri Lanka)
  workflow_dispatch:          # the "Run workflow" button (manual runs always make + publish)
    inputs:
      session:
        description: "Edition to make (short_a / short_b = standalone Short, news_* = Facebook news image post, lesson = trading lesson, basics = Crypto Basics, evergreen = top-up of `slot`, triggered = why crypto moved for `trigger`, recap = Saturday recap, topup_sun = Sunday weekly-floor top-up)"
        type: choice
        options: [short_a, short_b, news_morning, news_midday, news_evening, basics, lesson, recap, topup_sun, evergreen, triggered]
        default: short_a
      platforms:
        description: "Where to publish (limited to the edition's own platforms)"
        type: choice
        options: [all, youtube, facebook]
        default: all
      as_edition:
        description: "Count it as today's edition (its timed run will then skip)"
        type: boolean
        default: false
      scheduled:
        description: "Timed run (for the outside timer only)"
        type: boolean
        default: false
      slot:
        description: "Top-up only: fill this edition's slot today (a config.yaml session key; session lesson or evergreen); once per slot"
        type: string
        default: ""
      trigger:
        description: "Triggered edition only: the trigger id (data/triggers.json; the trigger poll passes it)"
        type: string
        default: ""

permissions:
  contents: write             # lets the job save data/history.json back to the repo

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    # a lesson renders two videos (16:9 + 9:16) and waits for Facebook to process its video
    timeout-minutes: 90
    # Timed runs of the same edition (timer + backup) queue one after the other, so the second sees
    # the first's upload and stops. Top-ups (`slot`) queue in their own group per slot (topup-<slot>), so a
    # slot's backup cron never cancels a waiting top-up; main.py's history check stops a second one.
    # Triggered runs (dispatched by the trigger poll, triggers.yml) queue in their own `triggered` group.
    # Manual runs get their own group: they never wait or cancel anything.
    concurrency:
      group: "${{ inputs.slot && format('topup-{0}', inputs.slot) || inputs.session == 'triggered' && 'triggered' || (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && format('timed-{0}', github.event_name == 'schedule' && (github.event.schedule == '17 12 * * *' && 'news_morning' || github.event.schedule == '17 13 * * *' && 'short_a' || github.event.schedule == '17 15 * * 3' && 'basics' || github.event.schedule == '17 15 * * 4' && 'lesson' || github.event.schedule == '17 15 * * 6' && 'recap' || github.event.schedule == '17 15 * * 0' && 'topup_sun' || github.event.schedule == '17 16 * * *' && 'news_midday' || github.event.schedule == '17 21 * * *' && 'news_evening' || github.event.schedule == '17 23 * * *' && 'short_b' || '') || inputs.session) || format('manual-{0}', github.run_id) }}"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and publish
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # which edition: from the backup cron that fired, or from the timer's / manual run's choice
          EDITION: "${{ github.event_name == 'schedule' && (github.event.schedule == '17 12 * * *' && 'news_morning' || github.event.schedule == '17 13 * * *' && 'short_a' || github.event.schedule == '17 15 * * 3' && 'basics' || github.event.schedule == '17 15 * * 4' && 'lesson' || github.event.schedule == '17 15 * * 6' && 'recap' || github.event.schedule == '17 15 * * 0' && 'topup_sun' || github.event.schedule == '17 16 * * *' && 'news_midday' || github.event.schedule == '17 21 * * *' && 'news_evening' || github.event.schedule == '17 23 * * *' && 'short_b' || '') || inputs.session || '' }}"
          SCHEDULED: ${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '--scheduled' || '' }}
          AS_EDITION: ${{ inputs.as_edition && '--as-edition' || '' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          # top-up into another edition's slot (crypto-pivot weekly floor); main.py checks the name
          SLOT: ${{ inputs.slot && format('--slot={0}', inputs.slot) || '' }}
          # the trigger a triggered run answers (main.py reads it through triggers.load)
          TRIGGER: ${{ inputs.trigger && format('--trigger={0}', inputs.trigger) || '' }}
        run: python main.py --session "$EDITION" --platforms "$PLATFORMS" $SCHEDULED $AS_EDITION ${SLOT:+"$SLOT"} ${TRIGGER:+"$TRIGGER"}

      - name: Save history
        if: always()
        run: |
          shopt -s nullglob
          entries=(output/*/history_entry.json)
          materials=(output/*/material.json)   # Shorts material of long videos (data/material/, epic 4 reads it)
          if [ ${#entries[@]} -eq 0 ]; then echo "Nothing published, nothing to log"; exit 0; fi
          git config user.name "shorts-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other runs may have pushed meanwhile: start from the latest history and add our entry.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            python -m autopilot.history add "${entries[@]}"
            if [ ${#materials[@]} -gt 0 ]; then
              python -m autopilot.material add "${materials[@]}" || echo "::warning::Shorts material not merged"
            fi
            git add data/history.json
            if [ -d data/material ]; then git add data/material/; fi
            if git diff --cached --quiet; then echo "History already up to date"; exit 0; fi
            git commit -qm "Log published edition"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "History saved"; exit 0; fi
            echo "Push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not save data/history.json"
          exit 1

      - name: Keep the video / post / lesson and logs for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/short.mp4
            output/*/lesson_*.mp4
            output/*/basics_*.mp4
            output/*/triggered_*.mp4
            output/*/recap_*.mp4
            output/*/trigger.json
            output/*/package.json
            output/*/material.json
            output/*/metadata.json
            output/*/data.json
            output/*/thumbnail.jpg
            output/*/post.jpg
            output/*/post.json
            output/*/caption_fb.txt
          retention-days: 7
          if-no-files-found: ignore
