name: Shorts autopilot
run-name: "${{ github.event_name == 'schedule' && 'Backup schedule' || (github.event.inputs.scheduled == 'true' && 'Timer' || 'Manual') }} · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.session }}"

on:
  # The main trigger is an outside timer (cron-job.org) calling workflow_dispatch on time with
  # scheduled=true; see CLAUDE.md. GitHub's own schedule is unreliable (runs hours late or
  # never), so these crons are only a backup, 17 min after each edition's start time.
  # Times are UTC. Sri Lanka time = UTC + 5:30.
  schedule:
    - cron: "47 0 * * *"    # Asia Open      (due 00:30 UTC → 06:00 Sri Lanka)
    - cron: "57 5 * * *"    # London Open    (due 05:40 UTC → 11:10 Sri Lanka)
    - cron: "47 12 * * *"   # New York Open  (due 12:30 UTC → 18:00 Sri Lanka)
  workflow_dispatch:          # the "Run workflow" button
    inputs:
      session:
        description: "Edition to make"
        type: choice
        options: [auto, asia, london, newyork]
        default: auto
      force:
        description: "Make it even if this edition is already uploaded today"
        type: boolean
        default: false
      scheduled:
        description: "Timed run (for the outside timer): weekend rule + skip if started too late"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save data/history.json back to the repo

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make and upload Short
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # which edition: from the schedule that fired, or from the manual run's choice
          SESSION: "${{ github.event_name == 'schedule' && (github.event.schedule == '47 0 * * *' && 'asia' || github.event.schedule == '57 5 * * *' && 'london' || 'newyork') || inputs.session || 'auto' }}"
          SCHEDULED: ${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '--scheduled' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python main.py --session "$SESSION" $SCHEDULED $FORCE

      - name: Save history
        if: always()
        run: |
          git config user.name "shorts-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Log uploaded Short"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Keep the video and logs for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/short.mp4
            output/*/package.json
            output/*/metadata.json
            output/*/data.json
            output/*/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
