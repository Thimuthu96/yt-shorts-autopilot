name: Gus Explains autopilot
run-name: "${{ github.event_name == 'schedule' && 'Backup schedule' || (github.event.inputs.scheduled == 'true' && 'Timer' || 'Manual') }} · ${{ github.event_name == 'schedule' && github.event.schedule || inputs.session }}${{ inputs.no_upload && ' · no upload' || '' }}"

on:
  # The main trigger is an outside timer (cron-job.org, setup_cronjobs.py) calling workflow_dispatch at each
  # edition's start_utc with scheduled=true. GitHub's own schedule is unreliable (runs hours late or never), so
  # these crons are only a backup, 17 min after the start time. Times are UTC (Sri Lanka = UTC + 5:30).
  # If you change a cron line, change the same string in EDITION below and in concurrency.group
  # (tests/test_workflow.py checks the three places agree with config.yaml).
  schedule:
    - cron: "42 16 * * *"   # Short A (due 16:25 UTC, publishes ~17:00 UTC → 22:30 Sri Lanka)
    - cron: "42 22 * * *"   # Short B (due 22:25 UTC, publishes ~23:00 UTC → 04:30 Sri Lanka)
  workflow_dispatch:          # the "Run workflow" button (manual runs make and publish unless no_upload)
    inputs:
      session:
        description: "Edition to make"
        type: choice
        options: [short_a, short_b]
        default: short_a
      platforms:
        description: "Where to publish"
        type: choice
        options: [all, youtube, facebook]
        default: all
      as_edition:
        description: "Count it as today's edition (its timed run will then skip)"
        type: boolean
        default: false
      scheduled:
        description: "Timed run (for the outside timer only)"
        type: boolean
        default: false
      story:
        description: "Optional: render this story JSON (repo path, e.g. stories/sample/lighthouse.json) instead of writing one"
        type: string
        default: ""
      topic:
        description: "Optional: write about this topic instead of the backlog's next one"
        type: string
        default: ""
      no_upload:
        description: "Make it only, publish nowhere (the video is in the run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: write             # lets the job save data/history.json, topics/backlog.yaml and stories/published/

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    # research + render (headless Chromium, every frame) + Facebook processing
    timeout-minutes: 90
    # Timed runs of the same edition (timer + backup) queue one after the other, so the second sees the first's
    # upload and stops. Manual runs get their own group: they never wait for or cancel anything.
    concurrency:
      group: "${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && format('timed-{0}', github.event_name == 'schedule' && (github.event.schedule == '42 16 * * *' && 'short_a' || github.event.schedule == '42 22 * * *' && 'short_b' || '') || inputs.session) || format('manual-{0}', github.run_id) }}"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node, Chromium, Python and ffmpeg
        uses: ./.github/actions/setup

      - name: Make and publish
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          # which edition: from the backup cron that fired, or from the timer's / manual run's choice
          EDITION: "${{ github.event_name == 'schedule' && (github.event.schedule == '42 16 * * *' && 'short_a' || github.event.schedule == '42 22 * * *' && 'short_b' || '') || inputs.session || '' }}"
          SCHEDULED: ${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && 'true' || '' }}
          AS_EDITION: ${{ inputs.as_edition && 'true' || '' }}
          NO_UPLOAD: ${{ inputs.no_upload && 'true' || '' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          STORY: ${{ inputs.story }}
          TOPIC: ${{ inputs.topic }}
        run: |
          args=(--session "$EDITION" --platforms "$PLATFORMS")
          [ -n "$SCHEDULED" ] && args+=(--scheduled)
          [ -n "$AS_EDITION" ] && args+=(--as-edition)
          [ -n "$NO_UPLOAD" ] && args+=(--no-upload)
          [ -n "$STORY" ] && args+=(--story "$STORY")
          [ -n "$TOPIC" ] && args+=(--topic "$TOPIC")
          python main.py "${args[@]}"

      - name: Save history
        if: always()
        run: |
          shopt -s nullglob
          entries=(output/*/history_entry.json)      # a run that published anywhere
          changes=(output/*/backlog_changes.json)    # topics marked used / failed, refill (publishing runs only)
          if [ ${#entries[@]} -eq 0 ] && [ ${#changes[@]} -eq 0 ]; then echo "Nothing published, nothing to log"; exit 0; fi
          git config user.name "gus-explains-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other runs may have pushed meanwhile: start from the latest main and re-apply this run's changes.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            if [ ${#entries[@]} -gt 0 ]; then
              python -m autopilot.history add "${entries[@]}"
              python -m autopilot.history stories "${entries[@]}"
            fi
            if [ ${#changes[@]} -gt 0 ]; then
              python -m autopilot.topics apply "${changes[@]}"
            fi
            git add data/history.json topics/backlog.yaml
            if [ -d stories/published ]; then git add stories/published/; fi
            if git diff --cached --quiet; then echo "History already up to date"; exit 0; fi
            git commit -qm "Log published edition"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "History saved"; exit 0; fi
            echo "Push rejected (attempt $attempt), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not save data/history.json"
          exit 1

      - name: Keep the video and logs for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/*/short.mp4
            output/*/short_fb.mp4
            output/*/thumbnail.jpg
            output/*/metadata.json
            output/*/story.json
            output/*/timeline.json
            output/*/history_entry.json
            output/*/backlog_changes.json
          retention-days: 7
          if-no-files-found: ignore
